name: Build and Deploy sendnoti-be

on:
  push:
    branches:
      - main
    paths:
      - "sendnoti-be/**"
      - ".github/workflows/build-be.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sendnoti-be/**"
      - ".github/workflows/build-be.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sendnoti-be-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sendnoti-be

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendnoti-be
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check main.js

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=low

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./sendnoti-be
          file: ./sendnoti-be/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update Helm image reference
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("sendnoti-gitops/be/values.yaml")
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          found_repository = False
          found_tag = False

          for line in lines:
              if line.startswith("  repository:"):
                  updated.append(f'  repository: {os.environ["IMAGE_NAME"]}')
                  found_repository = True
              elif line.startswith("  tag:"):
                  updated.append(f'  tag: "{os.environ["IMAGE_TAG"]}"')
                  found_tag = True
              else:
                  updated.append(line)

          if not found_repository or not found_tag:
              raise SystemExit("Expected image.repository and image.tag entries were not found in values.yaml")

          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY

      - name: Commit and push GitOps image reference
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sendnoti-gitops/be/values.yaml
          if git diff --cached --quiet; then
            echo "GitOps image reference is already up to date."
            exit 0
          fi
          git commit -m "chore(gitops): deploy sendnoti-be ${IMAGE_TAG}"
          git push origin HEAD:main
