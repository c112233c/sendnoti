apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sendnoti-be
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_GITHUB_OWNER/sendnoti.git
    targetRevision: main
    path: sendnoti-gitops/be
    helm:
      releaseName: sendnoti-be-30090
  destination:
    server: https://kubernetes.default.svc
    namespace: boat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
